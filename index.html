<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A Major Studio reading presentation for MS Data Viz, applying Amy J. Ko’s Design Methods to DVC’s first career panel."><title>Design Methods in Practice · DVC</title><link rel="stylesheet" href="style.css"></head>
<body><a class="skip" href="#main">Skip to activity</a>
<header><div class="wordmark">Design Methods <span>Major Studio · MS Data Viz</span></div><div class="tools"><button id="reading-toggle" aria-pressed="true">Book sidebar</button><button id="guide-open" aria-keyshortcuts="g" title="Open presenter guide (G)">Presenter guide <kbd aria-hidden="true">G</kbd></button><button id="fullscreen">Full screen</button></div></header>
<nav id="journey" aria-label="Presentation sections"></nav>
<div class="workspace" id="workspace"><main id="main" tabindex="-1"></main><aside id="reading" aria-label="Ideas from the reading"></aside></div>
<div class="progress" id="progress" aria-hidden="true"></div><footer><div id="status"></div><div class="nav-actions"><button id="previous" class="secondary">← Previous</button><span id="page-count"></span><button id="next" class="primary">Next →</button></div></footer>
